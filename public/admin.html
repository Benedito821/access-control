<!DOCTYPE html>
<html>
<head>
    <title>Access Control</title>

    <link rel="stylesheet" href="/bootstrap.min.css">
    <style>
    /* Default styles (light mode) */
    body {
        background-color: white;
        color: black;
        transition: background-color 0.3s, color 0.3s;
    }

    /* Dark mode styles */
    @media (prefers-color-scheme: dark) {
        body {
            background-color: #121212;
            color: white;
        }
    }
    </style>
</head>

<body class="text-center">

<div class="container vh-100 d-flex flex-column justify-content-center align-items-center">

    <h1 id="status" class="display-1 fw-bold">Waiting...</h1>
    <img id="photo" class="mt-4 rounded shadow" />
    <style>
    #photo {
        width: 500px;
        height: 500px;
        object-fit: cover;
        object-position: center;
    }
    </style>
    <h2 id="name" class="mt-3"></h2>
</div>

<script>
async function checkLast() {
    const res = await fetch('/last');
    const data = await res.json();

    const statusEl = document.getElementById('status');
    const nameEl = document.getElementById('name');
    const photoEl = document.getElementById('photo');

    if (data.access === 1) {
        statusEl.innerText = "ACCESS GRANTED";
        statusEl.className = "display-1 text-success";
        photoEl.style.border = "5px solid green";
    }
    else if (data.access === 0) {
        statusEl.innerText = "ACCESS DENIED";
        statusEl.className = "display-1 text-danger";
        photoEl.style.border = "5px solid red";
    } 
    else {
        statusEl.innerText = "STATE UNKNOWN";
        statusEl.className = "display-1 text-secondary";
    }

    nameEl.innerText = data.name || "Unknown";

    photoEl.src = '/' + (data.photo || 'uploads/default.jpg');
}

checkLast();
setInterval(checkLast, 1000);
</script>

</body>
</html>
